name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: web
          POSTGRES_PASSWORD: password
          POSTGRES_DB: django_web
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-secret-key
      DEBUG: 0
      SQL_ENGINE: django.db.backends.postgresql
      POSTGRES_DB: django_web
      POSTGRES_USER: web
      POSTGRES_PASSWORD: password
      SQL_HOST: localhost
      SQL_PORT: 5432

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test --verbosity 2

  publish:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      # Only needed to cross-build; keeping it here means adding linux/arm64 to
      # `platforms` below is the only change required.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ${{ env.REGISTRY }}
        # Pull requests from forks have no write access to packages, so only
        # branch and tag builds log in and push.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.prod
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Hands compose.deploy.yml to the organisation's app platform: the job joins
  # the tailnet and logs in to the app host through Tailscale SSH, so this
  # repository holds no SSH key. The platform runs the migrations before it
  # switches to the new image.
  #
  # These are the steps of the shared workflow
  # digital-organizing/infra/.github/workflows/deploy.yml, copied here: that
  # repository is private and this one is public, and a public repository
  # cannot call a workflow of a private one. Keep the two the same.
  deploy:
    needs: publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-link-shortener-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Join the tailnet as a CI node
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci-daily

      - name: Deploy
        env:
          APP: link-shortener-prod
          HOST: app-daily
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          address=$(tailscale ip -4 "$HOST")
          run() { ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "deploy@$address" "$@"; }
          printf '%s' "$REGISTRY_TOKEN" | run "registry-login ghcr.io $REGISTRY_USER"
          run "deploy $APP" < compose.deploy.yml
